name: report

services:
  ground-reporter:
    image: harbor.naivehero.top:8443/macda2/ground-reporter:v2.5.30
    container_name: ground-reporter
    hostname: ground-reporter
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=redpanda-1:9092,redpanda-2:9092,redpanda-3:9092
      # Phase 6: 启动时从 warning_lifecycle 拉活跃集合, 避免重启后整批重发 open 给平台
      - PG_DSN=postgres://postgres:passw0rd@timescaledb:5432/postgres?sslmode=disable
      # 各协议章节上报接口（本地测试指向 mock-platform；联调时改为真实地址）
      - FAULT_RECORD_URL=http://mock-platform:8188/gate/METRO-PHM/api/faultRecordsSubsystem/saveRecord
      - SYS_STATUS_URL=http://mock-platform:8188/gate/METRO-SELFCHECK-SUBSYSTEM/api/faultRecordsSubsystem/saveStatus
      - LIFE_RECORD_URL=http://mock-platform:8188/gate/METRO-PHM/api/devices/status/train/saveOrUpdate
      - PLATFORM_API_KEY=
      - PLATFORM_X_TOKEN=ap2jQ/2AVR4mHCHBXBlVkewphcPAMumty7czzXrPnWfWqLTOliDnG
      - PLATFORM_TIMEOUT_SEC=10
      - PLATFORM_RETRY_MAX=3
      - PLATFORM_RETRY_BACKOFF_MS=1000
      # 空调子系统标识（固定）
      - SUBSYSTEM_CODE=5
      - TRAIN_TYPE=B
      # 心跳周期（分钟）与每日批量报送时刻（小时，0=凌晨）
      - HEARTBEAT_INTERVAL_MIN=1
      - DAILY_BATCH_HOUR=0
      - LOG_LEVEL=INFO
      # 批量发送配置：减少 HTTP 调用频率，避免消息量大时阻塞消费
      # BATCH_SIZE: 累积多少条记录后发送（默认 50，设为 1 禁用批量）
      # FLUSH_INTERVAL_MS: 超时自动发送（默认 5000ms）
      - BATCH_SIZE=50
      - FLUSH_INTERVAL_MS=5000
    depends_on:
      mock-platform:
        condition: service_healthy
    networks:
      - macdanet

  mock-platform:
    image: golang:1.24-alpine
    container_name: mock-platform
    hostname: mock-platform
    restart: unless-stopped
    working_dir: /app
    command: go run main.go -port 8188
    volumes:
      - ${DATA_DIR}/connect/tests/mock-platform:/app:ro
    ports:
      - "18188:8188"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8188/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - macdanet

networks:
  macdanet:
    name: 1panel-network
    driver: bridge
    external: true
